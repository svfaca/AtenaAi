<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>AtenaAI</title>

    <!-- ⚡ Aplicar tema ANTES de qualquer renderização (evita flash) -->
    <script>
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.add('light');
        }
    })();
    </script>

    <!-- 🔐 BLOCKER CSS - Bloqueia página imediatamente, ANTES do body ser renderizado -->
    <style>
        /* Bloquear TUDO por padrão até validação */
        body {
            display: none !important;
        }
        /* Permitir apenas quando autorizado */
        body.auth-allowed {
            display: flex !important;
        }
        html, body {
            overflow: hidden;
            height: 100%;
        }
    </style>

    <!-- 🔐 GUARD INLINE - Validação de segurança ANTES da renderização -->
    <script>
    (function() {
        console.log("[🔐 GUARD] 🚀 Validação de segurança iniciada");
        window.__guardStarted = true;
        
        // Permitir renderização - usar documentElement como fallback
        const authorize = () => {
            const target = document.body || document.documentElement;
            target.classList.add('auth-allowed');
            window.__authHydrated = true;
            window.dispatchEvent(new Event('authHydrated'));
            console.log("[🔐 GUARD] ✅ Autorização inicial concedida");
        };
        
        // Se body já existe, autorizar imediatamente
        if (document.body) {
            authorize();
        } else {
            // Caso contrário, aguardar DOMContentLoaded
            document.addEventListener('DOMContentLoaded', authorize, { once: true });
        }
    })();
    </script>

    <link rel="icon" type="image/x-icon" href="./assets/logo/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo/favicon-32x32.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/main.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        };
        
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script>
    function setVH() {
      const vh = window.visualViewport
        ? window.visualViewport.height * 0.01
        : window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setVH();
    window.addEventListener('load', setVH);
    window.addEventListener('resize', setVH);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setVH);
    }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 flex flex-col overflow-hidden"
      style="height: calc(var(--vh, 1vh) * 100);">
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" class="hidden fixed bottom-4 right-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg p-4 z-50 flex gap-4 max-w-sm">
    <div id="toast-icon" class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full"></div>
    <div>
      <h3 id="toast-title" class="font-semibold text-gray-900 dark:text-white"></h3>
      <p id="toast-message" class="text-sm text-gray-600 dark:text-gray-300"></p>
    </div>
  </div>  <script type="module" src="./app.js"></script>
</body>
</html>
